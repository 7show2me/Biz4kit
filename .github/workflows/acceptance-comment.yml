# Lists the WBS acceptance items a PR has not ticked (Workflow doc: Automation).
# Not a required check: it reports, and the verifier decides.
name: Acceptance comment

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post acceptance comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/acceptance-comment.ts > comment.md
      - run: gh pr comment "$PR" --edit-last --create-if-none --body-file comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
