# Required checks on every pull request (Workflow doc: Required checks).
# Lighthouse and axe join this file with 1.5. The RLS cross-tenant suite and
# the migrations run in database.yml, on each PR's Neon branch (1.2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only; no real endpoints or secrets in CI.
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format (ultracite)
        run: pnpm check
      - run: pnpm check-types
      # packages/db runs in database.yml, on the PR's own Neon branch (D117).
      - run: pnpm test --filter=!@Biz4kit/db

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra
      - name: No load balancer or NAT gateway (D42)
        run: |
          if grep -rEn 'resource "aws_(lb|alb|elb|nat_gateway)"' infra --include='*.tf'; then
            echo "D42: the API runs without a load balancer or NAT gateway." >&2
            exit 1
          fi
      - name: Terraform tests (mocked AWS, no credentials)
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high
