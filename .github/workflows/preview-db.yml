# A Neon branch per pull request, copied from dev and deleted when the PR
# closes (D105). Dev holds generated demo data only, never real customers.
# The preview API that uses it waits on BIZ-87; migrations run here (1.2).
name: Preview database

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-db-${{ github.event.number }}

jobs:
  create:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: neondatabase/create-branch-action@v6
        id: branch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As the branch owner. The app role biz4kit_app comes with the copy of dev.
      - name: Apply migrations to the PR branch
        run: pnpm --filter @Biz4kit/db db:migrate:deploy
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          DATABASE_MIGRATION_URL: ${{ steps.branch.outputs.db_url }}
      - run: echo "Neon branch ${{ steps.branch.outputs.branch_id }} ready and migrated for PR ${{ github.event.number }}"

  delete:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
