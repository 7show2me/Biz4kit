    <style>
      /* BEGIN brand/theme.css */
/* Biz4Kit chrome theme (shadcn/ui variables). Source of truth for Biz4Kit's own UI:
   sign-in, onboarding, settings, billing, sidebar. Customer-facing pages use the
   business's generated theme instead (prep/Design inputs.md, "Theme generation").
   Fonts: https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,500..800&display=swap
   Local design system: brand/design-system/ (README.md, tokens.json). Preview: brand/preview.html */

  --background: oklch(0.9924 0.0028 308.4292);
  --foreground: oklch(0.1288 0.0219 314.0129);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.1288 0.0219 314.0129);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.1288 0.0219 314.0129);
  --primary: oklch(0.2236 0.1469 265.8205);
  --primary-foreground: oklch(1 0 0);
  --secondary: oklch(0.9387 0.0262 264.4409);
  --secondary-foreground: oklch(0.4691 0.2225 262.4817);
  --muted: oklch(0.9518 0.0057 308.3939);
  --muted-foreground: oklch(0.4882 0.0203 308.0008);
  --accent: oklch(0.9356 0.0312 279.862);
  --accent-foreground: oklch(0.4691 0.2225 262.4817);
  --destructive: oklch(0.5858 0.222 17.5846);
  --destructive-foreground: oklch(1 0 0); /* 4.7:1 on destructive */
  --border: oklch(0.916 0.012 313.2115);
  --input: oklch(0.916 0.012 313.2115);
  --ring: oklch(0.6219 0.2036 262.1505);
  --chart-1: oklch(0.4691 0.2225 262.4817);
  --chart-2: oklch(0.6056 0.2189 292.7172);
  --chart-3: oklch(0.6668 0.2591 322.1499);
  --chart-4: oklch(0.645 0.2154 16.4393);
  --chart-5: oklch(0.7049 0.1867 47.6044);
  --sidebar: oklch(0.9387 0.0262 264.4409);
  --sidebar-foreground: oklch(0.2138 0.0755 259.0572);
  --sidebar-primary: oklch(0.9924 0.0028 308.4292);
  --sidebar-primary-foreground: oklch(0.2108 0.0426 270.3694);
  --sidebar-accent: oklch(0.2506 0.0689 276.7216);
  --sidebar-accent-foreground: oklch(1 0 0);
  --sidebar-border: oklch(0.2445 0.0736 280.5871);
  --sidebar-ring: oklch(0.3447 0.1522 272.4233);
  --brand-ink: var(--primary);
  --brand-blue: var(--chart-1);

  /* Status (D26, D51). Text pairs: success on success-soft 4.8:1, warning on warning-soft 4.8:1,
     labels on the solid fills 5.0:1. Overdue uses the solid destructive fill (no soft red passes 4.5:1). */
  --success: #15803d;
  --success-foreground: #ffffff;
  --success-soft: #f0fdf4;
  --warning: #b45309;
  --warning-foreground: #ffffff;
  --warning-soft: #fffbeb;
  /* Extra status hues (D55) so no two statuses of one record share a colour. Text on soft:
     info 6.2:1, violet 6.5:1, teal 5.2:1; white labels on the solids 6.7 / 7.1 / 5.5:1. */
  --info: #1d4ed8;
  --info-foreground: #ffffff;
  --info-soft: #eff6ff;
  --violet: #6d28d9;
  --violet-foreground: #ffffff;
  --violet-soft: #f5f3ff;
  --teal: #0f766e;
  --teal-foreground: #ffffff;
  --teal-soft: #f0fdfa;
  --status-paid: var(--success);
  --status-due: var(--warning);
  --status-overdue: var(--destructive);

  --font-serif: "Fraunces", Georgia, "Times New Roman", serif;
  --font-display: var(--font-serif);
  --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius: 0.5rem; /* 8px: cards, dialogs, content panel (D54; was 1.25rem) */
  --radius-control: 6px; /* buttons */
  /* Supplied as hsl(0, 0, 0 / a), which browsers reject; same black, same alpha. */
  --shadow-2xs: 0px 4px 10px 0px rgb(0 0 0 / 0.05);
  --shadow-xs: 0px 4px 10px 0px rgb(0 0 0 / 0.05);
  --shadow-sm:
    0px 4px 10px 0px rgb(0 0 0 / 0.1), 0px 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow:
    0px 4px 10px 0px rgb(0 0 0 / 0.1), 0px 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-md:
    0px 4px 10px 0px rgb(0 0 0 / 0.1), 0px 2px 4px -1px rgb(0 0 0 / 0.1);
  --shadow-lg:
    0px 4px 10px 0px rgb(0 0 0 / 0.1), 0px 4px 6px -1px rgb(0 0 0 / 0.1);
  --shadow-xl:
    0px 4px 10px 0px rgb(0 0 0 / 0.1), 0px 8px 10px -1px rgb(0 0 0 / 0.1);
  --shadow-2xl: 0px 4px 10px 0px rgb(0 0 0 / 0.25);

  /* ---- Density (D52): compact workspace, same in both themes ---- */
  /* Type scale: size / leading. Families: display + heading = serif (24px and up only),
     title / body / caption / label = sans, money / code = mono. */
  --type-display-lg: 32px;
  --type-display-lg-leading: 38px; /* sign-in, onboarding */
  --type-heading: 24px;
  --type-heading-leading: 30px; /* record titles */
  --type-title: 15px;
  --type-title-leading: 22px; /* top bar, card and dialog titles */
  --type-body: 14px;
  --type-body-leading: 20px; /* forms, reading text */
  --type-body-sm: 13px;
  --type-body-sm-leading: 18px; /* default UI: nav, tables, buttons */
  --type-caption: 12px;
  --type-caption-leading: 16px; /* metadata, helper text, pills */
  --type-label: 11px;
  --type-label-leading: 16px; /* uppercase group and column labels */
  --type-money: 13px;
  --type-money-leading: 18px; /* amounts in rows */
  --type-money-lg: 24px;
  --type-money-lg-leading: 32px; /* KPI and document totals */
  --type-code: 12px;
  --type-code-leading: 16px; /* INV-2627-0042, GSTIN, UPI ID */

  /* Heights */
  --size-control-xs: 20px; /* pills, counters */
  --size-control-sm: 28px; /* row actions, segmented tabs, chips */
  --size-control-md: 32px; /* default button, input, select */
  --size-control-lg: 40px; /* onboarding and dialog primary action */
  --size-touch: 44px; /* minimum target on phones (NFR) */
  --size-row: 44px; /* table row */
  --size-row-sm: 36px; /* compact list row, table header */
  --size-nav-item: 32px; /* sidebar item */
  --size-header: 56px; /* panel top bar */
  --size-sidebar: 240px; /* workspace sidebar */
  --size-aside: 288px;       /* record side panel (quote, invoice, lead, customer) */
  --screen-tab: 600px;      /* tablet layout from here: icon rail, tables instead of lists */
  --screen-web: 1024px;     /* web layout from here: full sidebar, side panels */
  --size-icon: 16px;
  --size-icon-sm: 14px;

  /* Layout spacing (the 4px scale stays in tokens.json) */
  --space-inset: 8px; /* sidebar ground around the content panel */
  --space-page: 24px; /* panel content gutter */
  --space-card: 20px; /* card padding */
  --space-card-sm: 16px; /* dense card, phone card */

  /* Radius scale (D21 page-only 10px is not a product token) */
  --radius-xs: 4px; /* status pills, chips, counters, kbd, checkboxes */
  --radius-sm: 6px; /* inputs, selects, segmented tabs */
  --radius-md: 6px; /* menu items, popovers */
  --radius-xl: 10px; /* sheets, command palette */
  --radius-pill: 999px; /* round things only: avatars, dots, toggles */

  /* ---- Customer-facing pages (white label, prep "Theme generation", D34) ----
     Generated per workspace and set on the page root, never here: --biz (primary),
     --biz-foreground (white or near-black by contrast), --biz-soft (primary 50), --biz-accent.
     Fixed by Biz4Kit so no business can make an unreadable page: */
  --font-customer: "Inter", ui-sans-serif, system-ui, sans-serif;
  --customer-page: #fafaf9;
  --customer-surface: #ffffff;
  --customer-text: #1c1917;    /* 17.5:1 on surface */
  --customer-muted: #57534e;   /* 7.6:1 on surface */
  --customer-border: #e7e5e4;
}

  --sidebar: oklch(0.1692 0.0341 271.7324);

  --violet: #a78bfa;

  --customer-page: #0c0a09;
  --customer-surface: #1c1917;
  --customer-text: #fafaf9;    /* 16.7:1 on surface */
  --customer-muted: #a8a29e;   /* 6.9:1 on surface */

}

/* Customer pages use Inter for everything, amounts and codes included (D34): inside a
   font-customer scope the mono slot points at Inter, which has tabular figures. */
.font-customer {
  --font-mono: var(--font-customer);
}
/* END brand/theme.css */

    <style>
      /* Documents (proforma, invoice, PDF) always render the light business theme. The viewer sets --biz-l* per brand. */
      .doc {
        --biz: var(--biz-l);
        --biz-foreground: var(--biz-l-fg);
        --biz-soft: var(--biz-l-soft);
        --customer-page: #fafaf9;
        --customer-surface: #ffffff;
        --customer-text: #1c1917;
        --customer-muted: #57534e;
        --customer-border: #e7e5e4;
      }
      /* Viewer chrome only (device sizes). Not product styles. */
      .dev {
        margin: 16px auto;
        flex-shrink: 0;
      }
      .dev-tab {
        width: 820px;
        height: min(1180px, calc(100% - 32px));
      }
      .dev-mob {
        width: 390px;
        height: min(844px, calc(100% - 32px));
      }
      .cal-grid {
        display: grid;
        grid-template-columns: 56px repeat(3, minmax(140px, 1fr));
        grid-template-rows: var(--size-row-sm) repeat(
            18,
            var(--size-control-sm)
          );
      }
      /* A4 PDF page at 96 dpi (210 × 297 mm), zoomed out on tablet and phone like a PDF viewer. */
      .a4 {
        width: 794px;
        min-height: 1123px;
        margin: 0 auto;
      }
      @container (width < 1024px) {
        .a4 {
          zoom: 0.94;
        }
      }
      @container (width < 600px) {
        .a4 {
          zoom: 0.44;
        }
      }
      .tbl tbody tr:last-child td {
        border-bottom-width: 0;
      }
      .noscroll::-webkit-scrollbar {
        display: none;
      }
      body {
        background: var(--background);
        color: var(--foreground);
      }
      h1,
      h2,
      h3 {
        text-wrap: balance;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>

    <style type="text/tailwindcss">
      /* BEGIN brand/tailwind.css */
/* Biz4Kit project tokens as Tailwind v4 utilities. Load order: tailwindcss, then theme.css,
   then this file. Values live in theme.css; this file only names them. Use these utilities,
   never raw px / hex / arbitrary values (D52). Keep the words "at-import" out of comments:
   the Tailwind browser build used by design/screens-v2.html fails on them. */

@custom-variant dark (&:where(.dark, .dark *));

@theme inline {
  /* colour */
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-success: var(--success);
  --color-success-foreground: var(--success-foreground);
  --color-success-soft: var(--success-soft);
  --color-warning: var(--warning);
  --color-warning-foreground: var(--warning-foreground);
  --color-warning-soft: var(--warning-soft);
  --color-info: var(--info);
  --color-info-foreground: var(--info-foreground);
  --color-info-soft: var(--info-soft);
  --color-violet: var(--violet);
  --color-violet-foreground: var(--violet-foreground);
  --color-violet-soft: var(--violet-soft);
  --color-teal: var(--teal);
  --color-teal-foreground: var(--teal-foreground);
  --color-teal-soft: var(--teal-soft);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);
  --color-brand-ink: var(--brand-ink);
  --color-brand-blue: var(--brand-blue);
  /* customer pages: fixed neutrals + the four generated business slots */
  --color-customer-page: var(--customer-page);
  --color-customer-surface: var(--customer-surface);
  --color-customer-text: var(--customer-text);
  --color-customer-muted: var(--customer-muted);
  --color-customer-border: var(--customer-border);
  --color-biz: var(--biz);
  --color-biz-foreground: var(--biz-foreground);
  --color-biz-soft: var(--biz-soft);
  --color-biz-accent: var(--biz-accent);

  /* type families */
  --font-serif: var(--font-serif);
  --font-sans: var(--font-sans);
  --font-mono: var(--font-mono);
  --font-customer: var(--font-customer);

  /* type scale: text-display-lg, text-heading, text-title, text-body, text-body-sm,
     text-caption, text-label, text-money, text-money-lg, text-code */
  --text-display-lg: var(--type-display-lg);
  --text-display-lg--line-height: var(--type-display-lg-leading);
  --text-heading: var(--type-heading);
  --text-heading--line-height: var(--type-heading-leading);
  --text-title: var(--type-title);
  --text-title--line-height: var(--type-title-leading);
  --text-body: var(--type-body);
  --text-body--line-height: var(--type-body-leading);
  --text-body-sm: var(--type-body-sm);
  --text-body-sm--line-height: var(--type-body-sm-leading);
  --text-caption: var(--type-caption);
  --text-caption--line-height: var(--type-caption-leading);
  --text-label: var(--type-label);
  --text-label--line-height: var(--type-label-leading);
  --text-money: var(--type-money);
  --text-money--line-height: var(--type-money-leading);
  --text-money-lg: var(--type-money-lg);
  --text-money-lg--line-height: var(--type-money-lg-leading);
  --text-code: var(--type-code);
  --text-code--line-height: var(--type-code-leading);

  /* sizes: h-control-md, size-icon, w-sidebar, h-row, p-card, m-inset ... */
  --spacing-control-xs: var(--size-control-xs);
  --spacing-control-sm: var(--size-control-sm);
  --spacing-control-md: var(--size-control-md);
  --spacing-control-lg: var(--size-control-lg);
  --spacing-touch: var(--size-touch);
  --spacing-row: var(--size-row);
  --spacing-row-sm: var(--size-row-sm);
  --spacing-nav-item: var(--size-nav-item);
  --spacing-header: var(--size-header);
  --spacing-sidebar: var(--size-sidebar);
  --spacing-aside: var(--size-aside);
  --spacing-icon: var(--size-icon);
  --spacing-icon-sm: var(--size-icon-sm);
  --spacing-inset: var(--space-inset);
  --spacing-page: var(--space-page);
  --spacing-card: var(--space-card);
  --spacing-card-sm: var(--space-card-sm);

  /* radius (small, D54): rounded-xs (pills, chips), rounded-control (buttons), rounded-sm (inputs), rounded-md (menus),
     rounded-card (cards, dialogs, panel), rounded-xl (sheets), rounded-pill */
  --radius-xs: var(--radius-xs);
  --radius-control: var(--radius-control);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-card: var(--radius);
  --radius-xl: var(--radius-xl);
  --radius-pill: var(--radius-pill);

  /* layouts: media variants tab: / web: and container variants @tab: / @web: (600px, 1024px).
     Plain values: Tailwind needs literal breakpoints; keep them equal to --screen-tab / --screen-web. */
  --breakpoint-tab: 600px;
  --breakpoint-web: 1024px;
  --container-tab: 600px;
  --container-web: 1024px;

  /* elevation: shadow-sm (cards), shadow-md (popovers), shadow-lg (dialogs), shadow-xl (⌘K) */
  --shadow-xs: var(--shadow-xs);
  --shadow-sm: var(--shadow-sm);
  --shadow-md: var(--shadow-md);
  --shadow-lg: var(--shadow-lg);
  --shadow-xl: var(--shadow-xl);
}
/* END brand/tailwind.css */

      /* Components for this mockup, built from token utilities only. */
      @layer components {
        .btn {
          @apply h-control-md rounded-control text-body-sm inline-flex items-center justify-center gap-1.5 px-3 font-medium whitespace-nowrap;
        }
        .btn-sm {
          @apply h-control-sm gap-1 px-2.5;
        }
        .btn-lg {
          @apply h-control-lg text-body px-4;
        }
        .btn-icon {
          @apply w-control-md px-0;
        }
        .btn-sm.btn-icon {
          @apply w-control-sm;
        }
        .btn-primary {
          @apply bg-primary text-primary-foreground;
        }
        .btn-secondary {
          @apply bg-secondary text-secondary-foreground;
        }
        .btn-outline {
          @apply border-border bg-card text-foreground hover:bg-muted border;
        }
        .btn-ghost {
          @apply text-foreground hover:bg-accent hover:text-accent-foreground;
        }
        .card {
          @apply bg-card text-card-foreground rounded-card border-border border;
        }
        .field {
          @apply h-control-md bg-card border-input text-body-sm text-foreground flex w-full items-center gap-2 rounded-sm border px-3;
        }
        .flabel {
          @apply text-caption mb-1 block font-medium;
        }
        .hint {
          @apply text-caption text-muted-foreground mt-1;
        }
        .chip {
          @apply h-control-xs border-border text-caption text-foreground inline-flex items-center gap-1 rounded-xs border px-1.5 whitespace-nowrap;
        }
        .count {
          @apply h-control-xs min-w-control-xs bg-muted text-caption text-muted-foreground inline-flex items-center justify-center rounded-xs px-1.5 font-mono;
        }
        .pill {
          @apply h-control-xs text-caption inline-flex items-center gap-1 rounded-xs px-1.5 font-medium whitespace-nowrap;
        }
        .seg {
          @apply bg-muted inline-flex max-w-full items-center gap-0.5 overflow-x-auto rounded-sm p-0.5;
        }
        .seg > * {
          @apply h-control-sm text-body-sm text-muted-foreground inline-flex items-center gap-1.5 rounded-xs px-2.5 whitespace-nowrap;
        }
        .seg > .on {
          @apply bg-card text-foreground font-medium shadow-xs;
        }
        .th {
          @apply h-row-sm text-label text-muted-foreground border-border border-b px-3 text-left font-medium tracking-wider whitespace-nowrap uppercase;
        }
        .td {
          @apply h-row border-border text-body-sm border-b px-3 whitespace-nowrap;
        }
        .money {
          @apply text-money font-mono whitespace-nowrap tabular-nums;
        }
        .code {
          @apply text-code font-mono whitespace-nowrap;
        }
        .label {
          @apply text-label text-muted-foreground font-medium tracking-wider uppercase;
        }
        .avatar {
          @apply size-control-sm rounded-pill bg-secondary text-secondary-foreground text-caption inline-flex shrink-0 items-center justify-center font-semibold;
        }
        .kbd {
          @apply h-control-xs border-border bg-card text-caption text-muted-foreground inline-flex items-center rounded-xs border px-1.5 font-mono;
        }
        .check {
          @apply border-input bg-card inline-flex size-4 items-center justify-center rounded-xs border align-middle;
        }
        .toggle {
          @apply h-control-xs rounded-pill bg-muted inline-flex w-10 shrink-0 p-0.5;
        }
        .toggle > span {
          @apply rounded-pill bg-card block size-4 shadow-xs;
        }
        .toggle.on {
          @apply bg-primary;
        }
        .toggle.on > span {
          @apply translate-x-5;
        }
        /* customer pages: Inter, business slots, touch sizes */
        .cbtn {
          @apply h-touch text-body flex w-full items-center justify-center gap-2 rounded-sm font-semibold;
        }
        .cbtn-biz {
          @apply bg-biz text-biz-foreground;
        }
        .cbtn-line {
          @apply border-customer-border bg-customer-surface text-customer-text border;
        }
        .cfield {
          @apply h-touch bg-customer-surface border-customer-border text-body text-customer-text flex w-full items-center gap-2 rounded-sm border px-3;
        }
        .ccard {
          @apply rounded-card bg-customer-surface border-customer-border border;
        }
        /* Dialogs: phone = bottom sheet, tablet and web = centred card. Opened by data-open="id";
           data-close, the backdrop and Esc close them (viewer script). */
        .dlg {
          @apply absolute inset-0 z-30 flex items-end justify-center;
          background: color-mix(in oklab, var(--foreground) 40%, transparent);
          opacity: 0;
          visibility: hidden;
          transition:
            opacity 160ms ease,
            visibility 0s linear 160ms;
        }
        .dlg.open {
          opacity: 1;
          visibility: visible;
          transition: opacity 160ms ease;
        }
        .dlg-panel {
          @apply bg-popover text-popover-foreground p-card max-h-full w-full overflow-y-auto rounded-t-xl shadow-lg;
          transform: translateY(24px);
          transition: transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .dlg.open .dlg-panel {
          transform: none;
        }
        .grab {
          @apply bg-border rounded-pill mx-auto mb-3 h-1 w-10;
        }
        @container (width >= 600px) {
          .dlg {
            @apply p-page items-center;
          }
          .dlg-panel {
            @apply rounded-card max-w-md;
            transform: translateY(8px) scale(0.98);
          }
          .grab {
            @apply hidden;
          }
        }
        /* Menus: <details class="dd"> + .menu popover. One open at a time; outside click and Esc close it. */
        .dd > summary {
          @apply cursor-pointer list-none;
        }
        .dd > summary::-webkit-details-marker {
          display: none;
        }
        .menu {
          @apply bg-popover text-popover-foreground border-border absolute z-20 min-w-48 rounded-md border p-1 shadow-md;
          animation: menu-in 120ms ease-out;
        }
        .menu > a,
        .menu > button {
          @apply h-nav-item text-body-sm hover:bg-accent hover:text-accent-foreground flex w-full items-center gap-2 rounded-md px-2 text-left whitespace-nowrap;
        }
        .menu > hr {
          @apply border-border -mx-1 my-1;
        }
        .menu > .menu-label {
          @apply text-label text-muted-foreground px-2 py-1 font-medium tracking-wider uppercase;
        }
        /* Sidebar (reference: design/sidebar.jpeg). Tablet rail and collapsed web = icons only;
           web = labels. sb-text: label parts; sb-full: label-only rows (flex); sb-rail: rail-only bits;
           sb-web: web-only controls. Kept after .count / .btn so these display rules win. */
        .sb {
          @apply w-14;
        }
        .sb-item {
          @apply justify-center;
        }
        .sb-text,
        .sb-full,
        .sb-web {
          display: none;
        }
        .sb-mark {
          display: inline-flex;
        }
        .sb-tree {
          display: none;
        }
        @container (width >= 1024px) {
          .sb:not(.is-collapsed) .sb-mark {
            display: none;
          }
        }
        @container (width >= 1024px) {
          .sb-web {
            display: inline-flex;
          }
          .sb:not(.is-collapsed) {
            @apply w-sidebar;
          }
          .sb:not(.is-collapsed) .sb-text {
            display: revert;
          }
          .sb:not(.is-collapsed) .sb-full {
            display: flex;
          }
          .sb:not(.is-collapsed) .sb-rail {
            display: none;
          }
          .sb:not(.is-collapsed) .sb-item {
            @apply justify-start;
          }
          .sb.is-collapsed .sb-head {
            @apply flex-col;
          }
        }
        /* Sidebar look (owner, 22 Oct, reports/sidebar-options-2026-10-21.html): layout of option B (duotone icons,
           sections open to their pages on a dashed guide line, a bar marks the current page) and Favourites of
           option A (label + amber icon tiles). The page tabs stay. */
        .sb-sum {
          @apply text-foreground hover:bg-muted flex cursor-pointer list-none items-center gap-2 px-2 font-semibold;
        }
        .sb-sum::-webkit-details-marker {
          display: none;
        }
        .sb-sum i,
        .sb-page i {
          @apply text-muted-foreground text-[17px];
        }
        .sb-sub {
          @apply border-border mt-0.5 mb-1.5 ml-4 space-y-0.5 border-l border-dashed pl-2;
        }
        .sb-page {
          @apply text-muted-foreground hover:bg-muted hover:text-foreground relative flex items-center gap-2 px-2;
        }
        .sb-page[aria-current="page"] {
          @apply bg-secondary text-secondary-foreground font-semibold;
        }
        .sb-page[aria-current="page"] i {
          @apply text-info;
        }
        .sb-page[aria-current="page"]::before {
          content: "";
          @apply bg-info absolute top-1.5 bottom-1.5 -left-[9px] w-[3px] rounded-xs;
        }
        .sb-tile {
          @apply rounded-control inline-flex size-6 shrink-0 items-center justify-center text-[15px];
        }
        /* Choice cards (onboarding business type): one pressed per [data-choice] group. */
        .choice {
          @apply rounded-control border-border bg-card hover:bg-muted flex items-start gap-2.5 border p-3 text-left;
        }
        .choice[aria-pressed="true"] {
          @apply border-ring bg-accent ring-ring ring-1;
        }
        .choice[aria-pressed="true"] > svg {
          @apply text-accent-foreground;
        }
        .swatch {
          @apply rounded-pill border-border size-control-sm border-2;
        }
        .swatch[aria-pressed="true"] {
          @apply ring-ring ring-2 ring-offset-2;
        }
        input[type="range"] {
          @apply w-full;
          accent-color: var(--primary);
        }
        .ob-body > * {
          @apply mx-auto;
        }
        [data-go] {
          @apply cursor-pointer;
        }
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dlg,
        .dlg-panel,
        .menu {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>

      /* ---------- prototype checks ----------
         Renders every screen, state and device and checks: it renders without an error; every data-go

      let checking = false;
      function runChecks() {
        const keep = { ...st },
          keepDraft = { ...DRAFT },
          ids = new Set(S.map((s) => s.id)),
          fails = [];
        let renders = 0,
          checks = 0;

        /* Status colours: unique within each record. */
        for (const [rec, keys] of Object.entries(FAMILY)) {
          const used = keys.map((k) => ST[k][2]);
          test(new Set(used).size === used.length, { id: "invoices", name: `${rec} statuses`, dev: "web", state: 0, role: "owner" }, `two ${rec} statuses share a colour`);
        }
        /* Every screen and state: Owner on phone, tablet and web; the other roles on web. */
        for (const role of Object.keys(ROLES))
        for (const [i, s] of S.entries())
          for (let k = 0; k < (s.states ? s.states.length : 1); k++)
            for (const dev of role === "owner" ? ["mob", "tab", "web"] : ["web"]) {
              const where = { id: s.id, name: s.name, dev, state: k, role };
              Object.assign(st, { i, state: k, device: dev, role });
              try {
                render();
              } catch (err) {
                test(false, where, `render error: ${err.message}`);
                continue;
              }
              renders++;
              const f = stage.firstElementChild;
              f.querySelectorAll("[data-go]").forEach((el) =>
                test(
                  ids.has(el.dataset.go),
                  where,
                  `link to unknown screen "${el.dataset.go}"`
                )
              );
              f.querySelectorAll("[data-open]").forEach((el) =>
                test(
                  !!f.querySelector(`[data-dialog="${el.dataset.open}"]`),
                  where,
                  `opens a missing dialog "${el.dataset.open}"`
                )
              );
              f.querySelectorAll("i[data-lucide]").forEach((el) =>
                test(false, where, `unknown icon "${el.dataset.lucide}"`)
              );
              const seen = new Set();
              f.querySelectorAll("[id]").forEach((el) => {
                test(!seen.has(el.id), where, `duplicate id "${el.id}"`);
                seen.add(el.id);
              });
              f.querySelectorAll("button, a").forEach((el) =>
                test(
                  el.textContent.trim() ||
                    el.getAttribute("aria-label") ||
                    el.title,
                  where,
                  `${el.tagName.toLowerCase()} without a name: ${el.outerHTML.slice(0, 80)}`
                )
              );
              f.querySelectorAll("aside [data-grp], aside [data-page], [data-tabs] [data-go], nav[aria-label=Groups] [data-go]").forEach((el) =>
                test(canSee(screen(el.dataset.go)), where, `${ROLES[role]} is offered "${el.dataset.go}" but may not open it`)
              );
              if (role === "superadmin")
                test(!f.querySelector('[data-app] [data-need]:not([aria-disabled="true"])'), where, "Super-admin has an enabled action");
              if (!s.id.startsWith("p-"))
                test(!/\b(estimate|quotation)\b|QT-\d/i.test(f.textContent), where, "glossary: estimate, quotation or a QT- number on a workspace screen");
              if (dev !== "web" || role !== "owner") continue;
              const openers = [...f.querySelectorAll("[data-open]")].map(
                (el) => el.dataset.open
              );
              for (const id of new Set(openers)) {
                stage.querySelector(`[data-open="${id}"]`).click();
                const dlg = stage.querySelector(`[data-dialog="${id}"]`);
                test(
                  dlg?.classList.contains("open"),
                  where,
                  `dialog "${id}" does not open`
                );
                dlg?.querySelector("[data-close]")?.click();
                test(
                  !dlg?.classList.contains("open"),
                  where,
                  `dialog "${id}" does not close`
                );
              }
            }
        st.role = "owner";
        /* Staff dashboard is their day. */
        st.role = "staff";
        test(at("dashboard").textContent.includes("My day"), { id: "dashboard", name: "Staff dashboard", dev: "web", state: 0, role: "staff" }, "Staff dashboard is not My day");
        st.role = "owner";
        /* Sidebar (owner, 22 Oct): option B layout, the five sections open to their pages; option A Favourites;
           a section's pages stay as tabs too. */
        {
          const d = at("dashboard");
          const w = { id: "dashboard", name: "Sidebar", dev: "web", state: 0, role: "owner" };
          const tree = [...d.querySelectorAll('aside nav [data-grp-tree]')];
          test(tree.map((t) => t.dataset.grpTree).join() === NAV.map((g) => g[0]).join(), w, "the sidebar must list the five sections in order");
          test(tree.every((t) => t.querySelectorAll("[data-page]").length === pagesOf(NAV.find((g) => g[0] === t.dataset.grpTree)).length), w, "a section does not list all its pages");
          test(d.querySelector('aside nav .sb-text [aria-current="page"]')?.dataset.go === "dashboard" && d.querySelector('aside [data-grp-tree="Home"]').open, w, "the current page is not marked or its section is closed");
          const fav = d.querySelector('aside [aria-label="Favourites"]');
          test(!!fav && fav.querySelectorAll(".sb-text [data-fav] .sb-tile").length === FAVS.length, w, "Favourites must show each job on a tile (option A)");
          test(new Set([...fav.querySelectorAll(".sb-text .sb-tile")].map((t) => [...t.classList].find((c) => c.startsWith("text-")))).size === FAVS.length, w, "each Favourite needs its own icon colour");
          const set = d.querySelector("aside [data-settings]");
          test(!!set && !set.closest("details") && !NAV.some((g) => g[2].some((pg) => pg[0] === "settings")), w, "Settings must be its own item, not a Business page");
          test([d.querySelector("aside .sb-head"), fav, set].every((el) => el && el.classList.contains(el.matches(".sb-head") ? "border-b" : "border-t")), w, "dividers missing under the brand, above Favourites or above Settings");
          test([...d.querySelectorAll('aside i[class*="ph-"]')].every((el) => !["none", "normal", '""'].includes(getComputedStyle(el, "::before").content)), w, "a sidebar icon name is unknown to Phosphor");
          for (const id of ["invoices", "leads", "catalog"]) {
            const t = at(id).querySelector("[data-tabs]");
            test(!!t && getComputedStyle(t).display !== "none" && t.querySelectorAll("a").length >= 2, { id, name: "Section tabs", dev: "web", state: 0, role: "owner" }, "the section's pages are not shown as tabs");
          }
          at("invoice-editor");
          test(stage.querySelector('aside nav [data-grp][aria-current="page"]')?.dataset.grp === "Payments" && stage.querySelector('aside [data-grp-tree="Payments"]').open, w, "a detail screen does not mark its section");
        }
        /* Standard KPI strips have four cards on every page that has one; sidebar sub-items carry an icon. */
        for (const id of ["invoices", "overdue", "reports"]) {
          const n = at(id).querySelectorAll(".kpi-std").length;
          test(n === 4, { id, name: "Four KPI cards", dev: "web", state: 0, role: "owner" }, `${n} KPI cards, not 4`);
        }
        /* Design system (brand/design-system/README.md): Fraunces page heading, label group headings,
           32px nav items with 16px icons. */
        {
          const d = at("dashboard");
          const w = { id: "dashboard", name: "Design system", dev: "web", state: 0, role: "owner" };
          test(d.querySelector("main h2")?.classList.contains("font-serif"), w, "the Today heading must be Fraunces (heading, 24px)");
          test([...d.querySelectorAll("aside nav [data-grp], aside [data-fav]")].every((a) => a.classList.contains("h-nav-item")), w, "sidebar items must be size-nav-item (32px)");
        }
        /* Today opens with the greeting card and its quick jobs. */
        {
          const d = at("dashboard");
          test(/Welcome back, Priya!/.test(d.textContent) && !!d.querySelector('main [data-open="share-catalog"]') && !!d.querySelector('main [data-go="leads"][data-then="price-reply"]') && !!d.querySelector('main [data-open="new-invoice"]'), { id: "dashboard", name: "Greeting card", dev: "web", state: 0, role: "owner" }, "the greeting card or one of its quick jobs is missing");
        }
        /* Each sidebar group opens a page of that group. */
        for (const g of [...at("dashboard").querySelectorAll("aside [data-grp]")].map((el) => el.dataset.grp)) {
          at("dashboard").querySelector(`aside [data-grp="${g}"]`).click();
          test(groupOf(S[st.i].id)?.[0] === g, { id: "dashboard", name: "Sidebar groups", dev: "web", state: 0, role: "owner" }, `group "${g}" opened "${S[st.i].id}"`);
        }
        /* Dense dashboard: Owner, Manager and Accountant each get four numbers, one big line chart, three tables, Activity and Today work. */
        for (const role of ["owner", "manager", "accountant"]) {
          st.role = role;
          const d = at("dashboard");
          const w = { id: "dashboard", name: `${ROLES[role]} dashboard`, dev: "web", state: 0, role };
          test(d.querySelectorAll(".kpi").length === 4, w, "does not have four numbers");
          test(d.querySelectorAll(".chart-big svg path").length >= 3, w, "does not have one big line chart");
          test(d.querySelectorAll(".card table").length === 3, w, "does not have three tables");
          test(d.querySelectorAll(".kpi").length === 4 && !!d.querySelector(".chart-big svg path[d*=' C']"), w, "needs the four-cell KPI strip and the smooth area chart (dashboard5)");
          test(d.textContent.includes("Recent activity") && (d.textContent.includes("Today work") || d.textContent.includes("To approve")), w, "missing Recent activity, or Today work / To approve");
          test(!/Action items|Quick actions/.test(d.textContent), w, "side column still has Action items or Quick actions");
          if (role === "manager") test(!/₹/.test(d.textContent), w, "Manager dashboard shows a rupee amount");
        }
        st.role = "owner";
        /* V2 data checks: number series, one money source, GST maths, approval limit, branding. */
        {
          const w = (name) => ({ id: "invoices", name, dev: "web", state: 0, role: "owner" });
          for (const v of INVS) {
            if (v[0].startsWith("INV-")) test(v[4] === "paid" && v[3] === v[2], w("Number series"), `${v[0]} is a tax invoice but not fully approved (D60)`);
            if (v[4] === "paid") test(v[0].startsWith("INV-"), w("Number series"), `${v[1]} is paid but has no INV- number (D60)`);
            if (v[0] && !v[0].startsWith("INV-")) test(v[0].startsWith("PI-"), w("Number series"), `${v[0]} is neither PI- nor INV-`);
            if (v[6] === "reply") test(["awaiting", "pending", "paid", "expired"].includes(v[4]), w("Replies"), `reply ${v[0]} has status ${v[4]} (D75)`);
          }
          const pis = INVS.filter((v) => v[0].startsWith("PI-")).map((v) => v[0]);
          test(new Set(pis).size === pis.length, w("Number series"), "a PI- number is used twice");

          const page = (id, k = 0) => {
            const f = at(id, "web", k);
            return f.textContent;
          };
          const dash = page("dashboard");
          for (const [k, label] of [["week", "To collect this week"], ["overdue", "Overdue"], ["approve", "To approve"]])
            test(dash.includes(inr(total(MONEY[k]))), { id: "dashboard", name: "One money source", dev: "web", state: 0, role: "owner" }, `${label} on Today is not ${inr(total(MONEY[k]))}`);
          const inv = page("invoices");
          for (const k of ["due", "overdue", "approve"]) test(inv.includes(inr(total(MONEY[k]))), w("One money source"), `Invoices does not show ${inr(total(MONEY[k]))}`);
          test(page("reports").includes(inr(total(MONEY.owed))), { id: "reports", name: "One money source", dev: "web", state: 0, role: "owner" }, "Reports money owed differs from Invoices");
          test(!/INV-2627-0042|28,910|41,713|19,293/.test(S.map((s, i) => (s.states ? s.states.map((x, k) => page(s.id, k)) : [page(s.id)]).join(" ")).join(" ")), w("Old V1 figures"), "a V1 number is still shown");
          /* GST: 18% on Anita's ₹25,500 and on the quick invoice. */
          test(Math.round(25500 * 0.18) === 4590 && page("lead", 2).includes(inr(30090)) && page("lead", 2).includes(inr(4590)), { id: "lead", name: "GST maths", dev: "web", state: 2, role: "owner" }, "Anita's reply GST is not 18%");
          /* Manager limit: strictly below ₹5,000 (D57, D74). */
          st.role = "manager";
          const ap = at("approvals");
          test(ap.querySelector('[data-need="approve"][disabled]') && ap.textContent.includes("Owner must approve"), { id: "approvals", name: "Manager limit", dev: "web", state: 0, role: "manager" }, "Manager can approve ₹9,440 above the limit");
          st.role = "owner";
          /* D78: Biz4Kit lockup in the workspace; customer pages show Biz4Kit only as the footer; never on PDF or email. */
          test(!!at("dashboard").querySelector('aside [aria-label="Biz4Kit mark"] svg') && !at("dashboard").querySelector('[data-app] svg[aria-label="Biz4Kit"]'), { id: "dashboard", name: "Biz4Kit mark, no wordmark", dev: "web", state: 0, role: "owner" }, "the workspace shows the 4B mark only, never the Biz4Kit wordmark (D79)");
          test(!!at("dashboard").querySelector('aside summary[aria-label="Account and workspace menu"] [aria-label="Glow Studio"]') && /Glow Studio.*Priya Rao · Owner/s.test(at("dashboard").querySelector('aside summary[aria-label="Account and workspace menu"]').textContent) && !/GSTIN/.test(at("dashboard").querySelector('aside summary[aria-label="Account and workspace menu"]').textContent), { id: "dashboard", name: "Business logo", dev: "web", state: 0, role: "owner" }, "business logo is not on the profile button");
          for (const s of S.filter((x) => x.id.startsWith("p-") || x.id === "invoice-pdf" || x.id === "invoice-email"))
            for (let k = 0; k < (s.states ? s.states.length : 1); k++) {
              const t = page(s.id, k);
              const n = (t.match(/Biz4Kit/g) || []).length;
              /* D89: the footer only on catalog, request, booking and My orders; never on money pages or the warranty card. */
              const doc = !["p-catalog", "p-request", "p-book", "p-orders"].includes(s.id);
              test(doc ? n === 0 : n === 1 && t.includes("Made with Biz4Kit"), { id: s.id, name: "Biz4Kit on customer pages", dev: "web", state: k, role: "owner" }, doc ? "a money page or the warranty card shows Biz4Kit (D89)" : `shows Biz4Kit ${n} times; only the footer is allowed (D78, D89)`);
            }
        }
        /* D64: the dashboard Overdue card opens the Overdue page. */
        at("dashboard").querySelector('[data-go="overdue"]').click();
        test(S[st.i].id === "overdue", { id: "dashboard", name: "Overdue card", dev: "web", state: 0, role: "owner" }, `Overdue card opened "${S[st.i].id}"`);
        /* D61: a quoted lead offers Accept, Edit and Reject. */
        test(at("lead").querySelectorAll("[data-dialog]").length === 3 + READY.length, { id: "lead", name: "Quoted lead", dev: "web", state: 0, role: "owner" }, "quoted lead does not have its dialogs (price, edit, reject, one per ready message)");
        /* Sidebar: every link opens its screen. */
        const navIds = [
          ...at("dashboard").querySelectorAll("aside [data-go]"),
        ].map((el) => el.dataset.go);
        for (const id of navIds) {
          at("dashboard").querySelector(`aside [data-go="${id}"]`).click();
          test(
            S[st.i].id === id,
            { id: "dashboard", name: "Sidebar", dev: "web", state: 0 },
            `sidebar link "${id}" opened "${S[st.i].id}"`
          );
        }
        /* Onboarding chain: sign-in, then each step's primary button, up to done. */
        const chain = [
          "login",
          "new",
          "brand",
          "details",
          "catalog-starter",
          "team",
          "done",
        ];
        for (let n = 0; n < chain.length - 1; n++) {
          const f = at(chain[n]);
          (
            f.querySelector(".btn-primary[data-go]") ||
            f.querySelector("[data-go]")
          ).click();
          test(
            S[st.i].id === chain[n + 1],
            { id: chain[n], name: "Onboarding flow", dev: "web", state: 0 },
            `next step opened "${S[st.i].id}", expected "${chain[n + 1]}"`
          );
        }
        /* Business type responds. */
        const pick = at("new").querySelectorAll(".choice")[2];
        pick.click();
        test(
          pick.getAttribute("aria-pressed") === "true" &&
            st.vertical === pick.dataset.value,
          { id: "new", name: "Business type", dev: "web", state: 0 },
          "business type does not select"
        );
        /* Logo maker redraws. */
        const c1 = at("brand").querySelector('[data-logo="c1"]');
        c1.value = "X";
        c1.dispatchEvent(new Event("input", { bubbles: true }));
        test(
          stage.querySelector("[data-logo-made]").textContent.includes("X"),
          { id: "brand", name: "Logo maker", dev: "web", state: 0 },
          "logo preview does not follow Character 1"
        );
        checking = false;
        DRAFT = keepDraft;
        Object.assign(st, keep);
        render();
        window.checkResult = { screens: S.length, renders, checks, fails };
        showReport(window.checkResult);
        return window.checkResult;
      }
      function showReport({ screens, renders, checks, fails }) {
        const r = $("report");
        r.hidden = false;
        r.innerHTML = `<div class="flex items-center gap-2 h-header px-4 border-b border-border"><i data-lucide="list-checks" class="size-icon"></i><h2 class="text-title font-semibold">Prototype checks</h2><button class="ml-auto btn btn-ghost btn-sm btn-icon" data-x aria-label="Close"><i data-lucide="x" class="size-icon"></i></button></div>
  <div class="p-4 space-y-2 border-b border-border"><span class="pill ${fails.length ? BAD : OK}">${fails.length ? `${fails.length} failed` : "All passed"}</span>
    <p class="text-muted-foreground">${screens} screens · ${renders} renders (every state; Owner on phone, tablet and web, other roles on web) · ${checks} checks</p></div>
  <ul class="flex-1 overflow-y-auto divide-y divide-border">${
    fails
      .map(
        (f) =>
          `<li><button class="w-full text-left px-4 py-2 hover:bg-muted" data-to="${f.id}" data-dev="${f.dev}" data-state="${f.state}" data-role="${f.role || "owner"}"><span class="font-medium">${esc(f.name)}</span> <span class="code text-muted-foreground">${ROLES[f.role || "owner"]} · ${f.dev}${f.state ? ` · state ${f.state + 1}` : ""}</span><span class="block text-caption text-destructive">${esc(f.msg)}</span></button></li>`
      )
      .join("") || '<li class="p-4 text-muted-foreground">Nothing to fix.</li>'
  }</ul>`;
        lucide.createIcons();
      }
      $("check").onclick = runChecks;
      $("report").onclick = (e) => {
        if (e.target.closest("[data-x]")) $("report").hidden = true;
        const b = e.target.closest("[data-to]");
        if (b) {
          Object.assign(st, {
            i: S.findIndex((s) => s.id === b.dataset.to),
            device: b.dataset.dev,
            state: +b.dataset.state,
            role: b.dataset.role || "owner",
          });
          render();
        }
      };

      addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenus();
          if (opener) closeDialogs();
          return;
        }
        if (
          ["SELECT", "INPUT", "TEXTAREA"].includes(e.target.tagName) ||
          opener
        )
          return;
        if (e.key === "ArrowLeft") go(-1);
        if (e.key === "ArrowRight") go(1);
      });
      const autoCheck = /(^#|&)check\b/.test(location.hash);
      render();
      if (autoCheck) runChecks();
    </script>
  </body>
</html>
