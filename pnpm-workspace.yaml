packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: false
  # Hooks are installed by the root "prepare" script instead.
  lefthook: false
catalog:
  zod: ^4.6.7
  "@types/node": ^26.4.1
  varlock: 1.18.0
  tsx: ^4.23.13
  "@orpc/server": ^1.15.6
  "@orpc/openapi": ^1.15.6
  "@orpc/zod": ^1.15.6
  better-auth: 1.7.7
  evlog: ^2.30.1
  "@tanstack/react-query": ^5.104.2
  next-themes: ^0.4.6
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  "@orpc/tanstack-query": ^1.15.6
  "@orpc/client": ^1.15.6
  "@tanstack/react-form": ^1.33.5
  "@polar-sh/better-auth": ^1.8.4
  "@better-auth/expo": 1.7.7
  drizzle-orm: 1.0.0-rc.4
  vitest: ^5.0.5
overrides:
  # GHSA-27r3-jxmh-p828 (high): express via evlog and the shadcn CLI.
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  # Windows command injection (high), via the shadcn CLI's dotenvx; dev tooling only.
  systeminformation@<5.33.16: ^5.33.16
auditConfig:
  ignoreGhsas:
    # Only reached through the Expo CLI (apps/native dev and build tooling),
    # never in the server image or the web bundle. node-forge has no patch yet;
    # Expo pins zod 3. Our own zod is ^4.6.7 (patched). Review when Expo updates.
    - GHSA-86w9-cpqp-85rv
    - GHSA-mrhx-c7xc-m3w5
